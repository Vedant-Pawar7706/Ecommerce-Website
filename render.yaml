services:
  # -------------------------------------------------------------
  # Cartify FastAPI Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: cartify-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROJECT_NAME
        value: Cartify
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  # -------------------------------------------------------------
  # Cartify React + Vite Frontend Static Site
  # -------------------------------------------------------------
  - type: static
    name: cartify-frontend
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cartify-backend
          property: host
